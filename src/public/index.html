<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    input { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 4px; display: none; }
    a { color: #007bff; word-break: break-all; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <input type="text" id="urlInput" placeholder="Enter a long URL..." />
  <button onclick="shortenUrl()">Shorten</button>
  <div id="result"></div>

  <script>
    async function shortenUrl() {
      const url = document.getElementById('urlInput').value;
      if (!url) return alert('Please enter a URL');

      const res = await fetch('/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      const data = await res.json();
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <strong>Short URL:</strong><br>
        <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>
      `;
    }
  </script>
</body>
</html>
